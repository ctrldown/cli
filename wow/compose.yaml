version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: microfeature
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d microfeature"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
      
  # Apollo Router (Rover) for local federation testing
  rover-gateway:
    image: ghcr.io/apollographql/router:v1.43.0
    ports:
      - "4000:4000"
    volumes:
      - ./super.graphql:/dist/schema/super.graphql
    environment:
      APOLLO_ROUTER_SUPERGRAPH_PATH: /dist/schema/super.graphql
